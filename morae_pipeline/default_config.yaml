comfyui:
  host: "127.0.0.1"
  port: 8188

curation:
  enabled: true
  device: "cuda"

  # Scorer weights
  technical_weight: 0.5
  aesthetic_weight: 0.3
  face_weight: 0.2

  # Grade thresholds (composite 0.0 ~ 1.0)
  grade_a_min: 0.8
  grade_b_min: 0.6
  grade_c_min: 0.4

  # Enable/disable scorers
  technical_enabled: true
  aesthetic_enabled: true
  face_enabled: false         # Set to true + provide face_reference_path
  # face_reference_path: "./input/reference_face.png"

controlnet:
  enabled: false               # Set to true + provide pose_library_path
  model_name: "control_v11p_sd15_openpose.safetensors"

  # Pose library directory (subdirs = categories)
  # pose_library_path: "./input/poses"
  # pose_category: "pov"       # Filter by category

  # Strength range (randomized per image to prevent identical outputs)
  strength_default: 0.7
  strength_min: 0.5
  strength_max: 0.85

  # Ending step: guides early denoising only (allows detail variation)
  end_percent_default: 0.4
  end_percent_min: 0.3
  end_percent_max: 0.5

  # Variation seed for subtle per-image differences
  variation_enabled: true
  variation_strength: 0.05

censorship:
  enabled: false               # Set to true + provide yolo_model_path
  device: "cuda"

  # YOLO detector
  yolo_model_path: "./models/nsfw_yolo.pt"
  confidence_threshold: 0.3    # Low = aggressive (fewer misses, safer legally)
  # target_classes:            # null = use defaults (genitalia, anus, breast)

  # SAM2 precise segmentation (optional, bbox-only if disabled)
  sam2_enabled: false
  # sam2_model_path: "./models/sam2.pt"

  # Filter method: gaussian_blur, pixelate, black_bar, white_bar
  filter_method: "gaussian_blur"
  blur_radius: 40
  pixelate_factor: 10
  mask_padding: 10

queue:
  max_concurrent: 1
  retry_on_failure: 1
  timeout_seconds: 600

output_dir: "./output/morae"
