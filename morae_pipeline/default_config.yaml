comfyui:
  host: "127.0.0.1"
  port: 8188

curation:
  enabled: true
  device: "cuda"

  # Scorer weights
  technical_weight: 0.5
  aesthetic_weight: 0.3
  face_weight: 0.2

  # Grade thresholds (composite 0.0 ~ 1.0)
  grade_a_min: 0.8
  grade_b_min: 0.6
  grade_c_min: 0.4

  # Enable/disable scorers
  technical_enabled: true
  aesthetic_enabled: true
  face_enabled: false         # Set to true + provide face_reference_path
  # face_reference_path: "./input/reference_face.png"

character:
  enabled: false               # Set to true + provide characters_dir
  # characters_dir: "./input/characters"
  # default_character: "my_character"

  # IP-Adapter FaceID settings
  ip_adapter_model: "ip-adapter-faceid-plusv2_sd15.bin"
  clip_vision_model: "model.safetensors"

  # Tag injection
  prepend_tags: true            # Prepend character tags to positive prompt
  append_negative_tags: true    # Append character negative tags

controlnet:
  enabled: false               # Set to true to enable ControlNet pose control
  # Illustrious XL 전용 ControlNet (SD 1.5 모델 사용 금지!)
  # https://civitai.com/models/1359846/illustrious-xl-controlnet-openpose
  model_name: "illustrious-xl-controlnet-openpose.safetensors"

  # Pose library (하이브리드: 라이브러리 → 런타임 추출)
  library_path: "morae_pipeline/presets/controlnet"
  extraction_enabled: true     # DWPose로 레퍼런스에서 포즈 추출 허용

  # Strength settings
  strength: 0.7
  strength_min: 0.5
  strength_max: 0.85

  # Start/End percent (언제부터 언제까지 ControlNet 적용)
  start_percent: 0.0
  end_percent: 0.4
  end_percent_min: 0.3
  end_percent_max: 0.5

  # Variation seed for subtle per-image differences
  variation_enabled: true
  variation_strength: 0.05

censorship:
  enabled: false               # Set to true to enable post-processing censorship
  device: "cuda"

  # Detection (imgutils detect_censors — anime-optimized)
  confidence_threshold: 0.25   # Low = aggressive (fewer misses, safer legally)
  # target_classes:            # null = ["penis", "pussy"]

  # SAM2 pixel-precise segmentation
  sam2_model_cfg: "configs/sam2.1/sam2.1_hiera_l.yaml"
  sam2_checkpoint: "./models/sam2/sam2.1_hiera_large.pt"

  # Mask refinement (erode = shrink inward to minimize censored area)
  erode_pixels: 2
  dilate_pixels: 0
  blur_boundary: 3

  # Filter: white_bar (정밀 흰색), gaussian_blur, pixelate, black_bar
  filter_method: "white_bar"
  blur_radius: 40
  pixelate_factor: 10

queue:
  max_concurrent: 1
  retry_on_failure: 1
  timeout_seconds: 600

output_dir: "./output/morae"
